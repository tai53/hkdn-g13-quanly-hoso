# Tất cả biến dưới đây dùng cú pháp ${VAR:?...} nên BẮT BUỘC phải có file .env
# ở thư mục gốc (ngang hàng file này). Tạo bằng: cp .env.example .env
services:
  db:
    image: postgres:16-alpine
    container_name: qlhs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      POSTGRES_DB: ${DB_NAME:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
    ports:
      - "${DB_PORT:?chưa có file .env - hãy chạy lệnh cp .env.example .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?chưa có file .env - hãy chạy lệnh cp .env.example .env} -d ${DB_NAME:?chưa có file .env - hãy chạy lệnh cp .env.example .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qlhs_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
    ports:
      - "${PGADMIN_PORT:?chưa có file .env - hãy chạy lệnh cp .env.example .env}:80"
    depends_on:
      - db
    profiles: ["tools"]

  backend:
    build: ./backend
    container_name: qlhs_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      DB_PASSWORD: ${DB_PASSWORD:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      DB_NAME: ${DB_NAME:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:?chưa có file .env - hãy chạy lệnh cp .env.example .env}
    ports:
      - "${BACKEND_PORT:?chưa có file .env - hãy chạy lệnh cp .env.example .env}:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: qlhs_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:?chưa có file .env - hãy chạy lệnh cp .env.example .env}/api
    ports:
      - "${FRONTEND_PORT:?chưa có file .env - hãy chạy lệnh cp .env.example .env}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
